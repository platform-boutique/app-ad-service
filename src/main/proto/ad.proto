syntax = "proto3";

package hipstershop;

option java_package = "hipstershop";
option java_outer_classname = "AdProto";
option java_multiple_files = true;

service AdService {
  rpc GetAds(AdRequest) returns (AdResponse) {}
  // Counts a click on an ad (in memory, per process). NOT_FOUND for an unknown ad id.
  rpc RecordClick(RecordClickRequest) returns (RecordClickResponse) {}
  // Impressions and clicks per configured ad since this process started.
  rpc GetAdStats(GetAdStatsRequest) returns (GetAdStatsResponse) {}
}

message AdRequest {
  repeated string context_keys = 1;
}

message AdResponse {
  repeated Ad ads = 1;
}

message Ad {
  string redirect_url = 1;
  string text = 2;
  string id = 3;
}

message RecordClickRequest {
  string ad_id = 1;
}

message RecordClickResponse {}

message GetAdStatsRequest {}

message AdStat {
  string ad_id = 1;
  int64 impressions = 2;
  int64 clicks = 3;
}

message GetAdStatsResponse {
  repeated AdStat stats = 1;
}
