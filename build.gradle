plugins {
    id 'com.google.protobuf' version '0.9.6'
    id 'idea'
    id 'application'
}

repositories {
    mavenCentral()
}

description = 'Ad Service'
group       = 'adservice'
// jar manifest Implementation-Version = the service version when SERVICE_VERSION is not set (CODE-06);
// `-PappVersion=<v>` sets it at build time, the default is `dev`.
version     = project.findProperty('appVersion') ?: 'dev'

def grpcVersion        = '1.79.0'
def protocVersion      = '4.34.0'
def otelVersion        = '1.49.0'
def otelInstrVersion   = '2.16.0'
def pyroscopeVersion   = '0.14.0'

tasks.withType(JavaCompile) {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Force all transitive Netty deps to a patched version (Trivy HIGH/CRITICAL, fixed in 4.1.137.Final)
configurations.configureEach {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == 'io.netty'
                && !details.requested.name.contains('tcnative')) {
            details.useVersion '4.1.137.Final'
            details.because 'CVE-2026-75595, CVE-2026-44249, CVE-2026-45416, CVE-2026-50010 fixed in 4.1.137.Final'
        }
        if (details.requested.group == 'com.fasterxml.jackson.core'
                && details.requested.name != 'jackson-annotations') {
            details.useVersion '2.21.7'
            details.because 'jackson-core/databind HIGH CVEs fixed in 2.21.7'
        }
        if (details.requested.group == 'com.google.guava' && details.requested.name == 'guava') {
            details.useVersion '33.7.2-jre'
            details.because 'CVE-2026-102554 (HIGH, denial of service) fixed in 33.7.2; grpc brings 33.5.0-jre transitively'
        }
    }
}

dependencies {
    // gRPC
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "io.grpc:grpc-netty:${grpcVersion}"
    implementation "io.grpc:grpc-services:${grpcVersion}"
    implementation "javax.annotation:javax.annotation-api:1.3.2"
    implementation "com.google.protobuf:protobuf-java:${protocVersion}"
    implementation "com.google.guava:guava:33.4.8-jre"

    // OpenTelemetry — traces, metrics and logs over OTLP/gRPC
    implementation "io.opentelemetry:opentelemetry-api:${otelVersion}"
    implementation "io.opentelemetry:opentelemetry-sdk:${otelVersion}"
    implementation "io.opentelemetry:opentelemetry-exporter-otlp:${otelVersion}"
    implementation "io.opentelemetry.semconv:opentelemetry-semconv:1.25.0-alpha"
    implementation "io.opentelemetry.instrumentation:opentelemetry-grpc-1.6:2.9.0-alpha"
    implementation "io.opentelemetry:opentelemetry-extension-trace-propagators:${otelVersion}"
    // JVM runtime metrics (OBS-20): jvm.memory/gc/threads/classes/cpu. Same release as the Log4j appender below,
    // which keeps it on the OpenTelemetry API 1.49 used here (2.15.0-alpha depends on opentelemetry-api 1.49.0).
    implementation "io.opentelemetry.instrumentation:opentelemetry-runtime-telemetry-java17:2.15.0-alpha"
    // Logs — forwards Log4j2 records (with trace ids) to the OTel logs pipeline
    implementation "io.opentelemetry.instrumentation:opentelemetry-log4j-appender-2.17:2.15.0-alpha"
    // Puts trace_id / span_id of the current span into the Log4j2 thread context, so the stdout JSON carries them
    // (same release as the appender above; reason: stdout logs had no reliable trace ids, OBS-30)
    implementation "io.opentelemetry.instrumentation:opentelemetry-log4j-context-data-2.17-autoconfigure:2.15.0-alpha"

    // Pyroscope — continuous profiling
    implementation "io.pyroscope:agent:${pyroscopeVersion}"

    // Logging
    implementation "org.apache.logging.log4j:log4j-core:2.25.0"
    implementation "org.apache.logging.log4j:log4j-layout-template-json:2.25.0"

    runtimeOnly "io.netty:netty-tcnative-boringssl-static:2.0.75.Final"
    // already shipped at runtime (OTLP exporter); now also compiled against to parse the ad config
    implementation "com.fasterxml.jackson.core:jackson-databind:2.21.7"

    // Testing
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.11.4"
    testImplementation "io.grpc:grpc-testing:${grpcVersion}"
    testImplementation "io.grpc:grpc-inprocess:${grpcVersion}"
    // InMemoryMetricReader / InMemorySpanExporter for the runtime-metrics test (same release as the SDK)
    testImplementation "io.opentelemetry:opentelemetry-sdk-testing:${otelVersion}"
}

test {
    useJUnitPlatform()
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protocVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/java'
            srcDirs 'build/generated/source/proto/main/grpc'
        }
        proto {
            srcDir 'src/main/proto'
        }
    }
}

application {
    mainClass = 'hipstershop.AdService'
}

jar {
    manifest {
        attributes 'Main-Class': 'hipstershop.AdService', 'Implementation-Version': project.version
    }
}

startScripts.enabled = false

task adService(type: CreateStartScripts) {
    mainClass.set('hipstershop.AdService')
    applicationName = 'AdService'
    outputDir = new File(project.buildDir, 'tmp')
    classpath = startScripts.classpath
}

applicationDistribution.into('bin') {
    from(adService)
    fileMode = 0755
}

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}